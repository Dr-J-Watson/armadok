# markdownlint configuration. The READMEs use inline HTML (centred header, cards),
# long lines and compact lists on purpose, so those rules are disabled.
config:
  default: true
  MD013: false   # line length
  MD022: false   # blank lines around headings
  MD024: false   # duplicate headings (the two languages repeat sub-headings)
  MD026: false   # trailing punctuation in headings
  MD031: false   # blank lines around fenced blocks
  MD032: false   # blank lines around lists
  MD033: false   # inline HTML
  MD036: false   # bold used as a heading
  MD041: false   # first line must be a heading (the READMEs start with an anchor)
  MD051: false   # link fragments (accented anchors are validated elsewhere)
  MD058: false   # blank lines around tables
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
