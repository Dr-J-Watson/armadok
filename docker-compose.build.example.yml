# Example: build Armadok from this repository and run it locally (no Traefik, plain HTTP).
# Copy to docker-compose.yml (git-ignored) and adapt.
#
#   docker compose up -d --build     # the hub, on http://127.0.0.1:8000
#
# Other machines run a worker: see docker-compose.worker.example.yml.
services:
  armadok:
    build: .
    image: armadok:local
    labels:
      # Armadok never stops, restarts or removes a container carrying this label.
      armadok.protect: "true"
    restart: unless-stopped
    environment:
      ARMADOK_ENCRYPTION_KEY: ${ARMADOK_ENCRYPTION_KEY:?set it in .env}
      # Plain HTTP on localhost: the refresh cookie cannot be "Secure" here. Keep the default
      # (true) as soon as the hub is behind HTTPS.
      ARMADOK_COOKIE_SECURE: "false"
      # Manage this machine as a node, with no worker. The hub then acts on the machine itself:
      # a compromised hub could do what the Docker socket allows. Remove these lines (and the
      # socket below) if you only manage other machines through workers.
      ARMADOK_LOCAL_NODE: "true"
      # Optional folders the local node may use (mount them below). These are ROOTS: in a node's
      # Configuration tab a person with the right can only pick a sub-folder inside them.
      # ARMADOK_PROJECTS_DIR: /stacks
      # The same folder as the Docker daemon sees it (the host path): needed for the terminal.
      # ARMADOK_PROJECTS_HOST_DIR: ${PROJECTS_DIR}
      # ARMADOK_TRAEFIK_DIR: /traefik-dynamic
      # ARMADOK_BACKUP_DIR: /backups
      # Traefik's metrics, on a private entry point of the same Docker network (not published).
      # ARMADOK_TRAEFIK_METRICS_URL: http://traefik:8080/metrics
      # Traefik's JSON access log, for the Visitors panel (mount the file read-only below).
      # ARMADOK_TRAEFIK_ACCESSLOG: /traefik-logs/access.log
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - armadok-data:/data
      # Full Docker control, which is root on this machine: deployments (`docker compose up`) need it.
      - /var/run/docker.sock:/var/run/docker.sock
      # - ${PROJECTS_DIR}:/stacks
      # - ${TRAEFIK_DYNAMIC_DIR}:/traefik-dynamic
      # - ${BACKUP_DIR}:/backups
    group_add:
      - ${DOCKER_GID:?set it in .env}
      # The group that may write in the projects and Traefik folders (when they are mounted).
      # - ${PROJECTS_GID}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  armadok-data:
