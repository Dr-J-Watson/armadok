# Example: an Armadok worker on a machine you want to manage. One worker per machine.
# Copy to docker-compose.yml on that machine (git-ignored) and adapt.
#
# First start: create the node in Armadok, click "Enrol a worker", and put the displayed
# values in .env (ARMADOK_HUB_KEY, ARMADOK_ENROL_TOKEN). The token works once for 15 minutes;
# after the worker has connected you can remove ARMADOK_ENROL_TOKEN.
services:
  armadok-worker:
    image: ghcr.io/dr-j-watson/armadok:edge
    labels:
      # Armadok never stops, restarts or removes a container carrying this label.
      armadok.protect: "true"
    command: ["python", "-m", "armadok.worker"]
    restart: unless-stopped
    environment:
      # The worker dials the hub: no port has to be opened on this machine.
      ARMADOK_HUB_URL: wss://armadok.example.com/api/v1/worker/connect
      ARMADOK_HUB_KEY: ${ARMADOK_HUB_KEY:?set it in .env}
      ARMADOK_ENROL_TOKEN: ${ARMADOK_ENROL_TOKEN:-}
      # The only folder whose Compose projects Armadok can read and edit (mounted below).
      ARMADOK_PROJECTS_DIR: /stacks
      # The same folder as the Docker daemon sees it (the host path). Needed by the project
      # terminal, which asks the daemon to mount a project folder: leave it out to keep that
      # feature off on this machine.
      ARMADOK_PROJECTS_HOST_DIR: ${PROJECTS_DIR:?set it in .env}
      # Traefik's DYNAMIC configuration folder only (never the folder holding traefik.yml, which
      # may contain tokens). Whoever may write there can publish anything Traefik can reach.
      # Uncomment this line and the matching volume below on a machine that runs Traefik.
      # ARMADOK_TRAEFIK_DIR: /traefik-dynamic
      # Traefik's STATIC configuration (traefik.yml): mount the FOLDER that holds it, writable
      # (Armadok replaces the file, keeping the old copy in a hidden sub-folder). Optional.
      # ARMADOK_TRAEFIK_STATIC_DIR: /traefik-static
      # Where Traefik's Prometheus metrics are read, for the Traffic tab. Use a PRIVATE entry
      # point of Traefik (never published) reachable on a Docker network the worker also joins.
      # No visitor address is in these metrics. Optional.
      # ARMADOK_TRAEFIK_METRICS_URL: http://traefik:8082/metrics
      # Git repositories on this machine's own network (a self-hosted Git server) are refused by
      # default, so a repository address cannot be used to probe the network. Set to true to allow.
      # ARMADOK_GIT_ALLOW_PRIVATE: "false"
      # Traefik's acme.json, to show its certificates. The file holds the PRIVATE KEYS: Armadok
      # reads it and sends only public facts (names, issuer, dates), never a key. Mount it
      # read-only, preferably on its own (a folder that holds nothing else).
      # ARMADOK_ACME_FILE: /acme/acme.json
      # Where volume backups are written (mounted below). Archives are made by a short-lived
      # helper container and handed to the folder's group (mode 0640): the worker lists, deletes
      # and, for a person who asked with a fresh second-factor code, reads them out. Give the
      # folder to the worker's group with write access (chmod g+ws).
      # ARMADOK_BACKUP_DIR: /backups
    volumes:
      # The worker's identity key lives here: keep this volume.
      - armadok-worker-data:/data
      # Your Compose projects, one sub-folder each. Armadok edits only the Compose files in it.
      - ${PROJECTS_DIR:?set it in .env}:/stacks
      # - ${TRAEFIK_DYNAMIC_DIR:?set it in .env}:/traefik-dynamic
      # - ${TRAEFIK_STATIC_DIR:?set it in .env}:/traefik-static
      # - ${ACME_DIR:?set it in .env}:/acme:ro
      # - ${BACKUP_DIR:?set it in .env}:/backups
      # Full Docker control, which is root on this machine: deployments (`docker compose up`) need it.
      - /var/run/docker.sock:/var/run/docker.sock
    # The group that owns the Docker socket (find it with: stat -c %g /var/run/docker.sock).
    # Groups the worker joins: the one owning the Docker socket, and one with write access to
    # your projects folder (make the folder group-writable: chmod -R g+w and chgrp).
    group_add:
      - ${DOCKER_GID:?set it in .env}
      - ${PROJECTS_GID:?set it in .env}
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  armadok-worker-data:
