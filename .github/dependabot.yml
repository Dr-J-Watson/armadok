# Dependabot: version updates and (separately, in the repository settings) security alerts.
# Only GitHub Actions exists today. Uncomment the other ecosystems when their folders exist,
# otherwise Dependabot reports a configuration error.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

