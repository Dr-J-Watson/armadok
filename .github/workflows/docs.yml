name: Docs

# Structure of the two full READMEs, Markdown style and local links.
# The two Markdown checks are advisory (continue-on-error) until they have been run once
# on real content; remove continue-on-error to make them blocking.
on:
  pull_request:
    paths: ["**.md", "scripts/check_readme_parity.py", ".markdownlint-cli2.yaml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["**.md"]

permissions:
  contents: read

jobs:
  parity:
    name: README parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_readme_parity.py

  markdown:
    name: Markdown style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25

  links:
    name: Local links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md"
          fail: true
