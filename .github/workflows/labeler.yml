name: Labeler

# Adds area labels to pull requests from the files they change (see .github/labeler.yml).
# Uses pull_request_target to be able to label PRs from forks; no PR code is executed.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
