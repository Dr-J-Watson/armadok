name: Dev image

# Test image built on every push to `develop`. Never a release.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: |
          [ -f Dockerfile ] && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.chk.outputs.docker == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.chk.outputs.docker == 'true'
      - uses: docker/login-action@v3
        if: steps.chk.outputs.docker == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        if: steps.chk.outputs.docker == 'true'
        env:
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMG="ghcr.io/${OWNER,,}/armadok"
          echo "list=$IMG:dev,$IMG:dev-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "app_version=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.chk.outputs.docker == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: APP_VERSION=${{ steps.tags.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.app_version }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
