name: Release

# On every push to main: keep the release pull request up to date (release-please)
# and publish the `edge` image. When the release pull request is merged, also
# publish the versioned image (1.2.3, 1.2, 1, latest), signed, with SBOM and provenance.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # release-please: tags, releases, changelog
  pull-requests: write   # release-please: release pull request
  packages: write        # push the image to GHCR
  id-token: write        # keyless image signing (cosign)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A personal token (optional secret) makes the release PR come from the owner,
          # so its checks run without manual approval. Falls back to the default token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: chk
        run: |
          [ -f Dockerfile ] && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: steps.chk.outputs.docker == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.chk.outputs.docker == 'true'
      - uses: docker/login-action@v4
        if: steps.chk.outputs.docker == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        if: steps.chk.outputs.docker == 'true'
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          VERSION: ${{ needs.release-please.outputs.version }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMG="ghcr.io/${OWNER,,}/armadok"
          LIST="$IMG:edge"
          APP_VERSION="edge-${SHA::7}"
          if [ "$RELEASE_CREATED" = "true" ]; then
            LIST="$LIST,$IMG:$VERSION,$IMG:${VERSION%.*},$IMG:${VERSION%%.*},$IMG:latest"
            APP_VERSION="$VERSION"
          fi
          {
            echo "image=$IMG"
            echo "list=$LIST"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        if: steps.chk.outputs.docker == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: APP_VERSION=${{ steps.tags.outputs.app_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.app_version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - uses: sigstore/cosign-installer@v3
        if: steps.chk.outputs.docker == 'true' && needs.release-please.outputs.release_created == 'true'
      - name: Sign the released image
        if: steps.chk.outputs.docker == 'true' && needs.release-please.outputs.release_created == 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
