name: PR title

# The pull request title becomes the squash commit and feeds the changelog,
# so it must be a Conventional Commit. Only the title is read: no code is checked out.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
            security
          scopes: |
            docker
            traefik
            dns
            certs
            git
            nodes
            worker
            rights
            auth
            audit
            notes
            notify
            ui
            i18n
            api
            ops
            security
            deps
          requireScope: false
