name: Image vulnerability scan

# Nightly scan of the PUBLISHED image, so a vulnerability published after a release
# is detected even without a new commit. Skipped while no image has been published.
on:
  schedule:
    - cron: "17 3 * * *"   # every night, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Does the image exist?
        id: exists
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          IMG="ghcr.io/${OWNER,,}/armadok:latest"
          if docker manifest inspect "$IMG" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMG" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No published image yet: nothing to scan."
          fi
      - name: Scan
        if: steps.exists.outputs.found == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.exists.outputs.image }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload results to code scanning
        if: steps.exists.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: image-trivy
