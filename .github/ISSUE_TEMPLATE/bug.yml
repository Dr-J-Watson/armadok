name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not report security problems here**: use the private report (Security tab).
        Remove secrets, real domains and real IP addresses from anything you paste.
  - type: input
    id: version
    attributes:
      label: Armadok version
      description: Version or image tag (for example `0.3.1`, `edge`, or a commit).
    validations:
      required: true
  - type: dropdown
    id: node-type
    attributes:
      label: Where does it happen?
      options:
        - Interface (hub)
        - Network node (Traefik / DNS)
        - Docker node
        - Full node (Docker + Traefik)
        - API
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For interface problems, for example "Firefox 130 on Linux" or "Safari on iPhone".
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant log lines or screenshots. Remove all secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets, real domains and real IP addresses from this report.
          required: true
