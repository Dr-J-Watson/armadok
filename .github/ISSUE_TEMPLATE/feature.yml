name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docker / Compose projects
        - Git and updates
        - Traefik
        - DNS
        - Certificates
        - Traffic statistics
        - Nodes and workers
        - Rights and security
        - Notifications
        - Interface / translations
        - API and integrations
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
